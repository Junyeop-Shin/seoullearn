# 요청 본문과 쿼리 문자열은 로그에 남기지 않는다
log_format minimal '$remote_addr [$time_local] "$request_method $uri" $status $request_time';

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # 화면은 같은 출처의 /api로만 요청한다. backend로 넘긴다.
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        client_max_body_size 1m;
        access_log /var/log/nginx/access.log minimal;
    }

    # 화면 주소(/mentees/<멘티 이름>)에는 멘티 이름이 들어가므로 로그에 남기지 않는다
    location / {
        access_log off;
        try_files $uri $uri/ /index.html;
    }
}
