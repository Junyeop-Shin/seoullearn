# 요청 본문과 쿼리 문자열, 접속 주소(IP)는 로그에 남기지 않는다 (개인정보 처리방침: 요청 시각, 경로, 처리 결과만)
log_format minimal '[$time_local] "$request_method $uri" $status $request_time';
# 오류 로그에는 접속 주소가 함께 찍히므로 심각한 오류만 남긴다
error_log /var/log/nginx/error.log crit;
# 가입 요청은 주소마다 1분에 10번까지 (계정을 마구 만들어 AI 호출을 쓰는 것을 막는다). 한꺼번에 몰리는 40번까지는 바로 받는다:
# 같은 공유기를 쓰는 교육장에서 여럿이 함께 가입할 수 있어야 한다. Docker Desktop이나 다른 프록시 뒤에서는 모든 접속이 한 주소로 보여 이 한도를 함께 쓴다
limit_req_zone $binary_remote_addr zone=signup:1m rate=10r/m;

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    # 기본 접근 로그(접속 주소와 요청 줄 전체가 남는다)를 끈다. 주소가 너무 길거나 헤더가 깨져 location에 닿기 전에 끝나는 요청도 남지 않게 한다.
    # /api만 아래에서 minimal 형식으로 남긴다
    access_log off;

    # 화면은 같은 출처의 /api로만 요청한다. backend로 넘긴다.
    proxy_set_header Host $host;
    # 맨 앞단이므로 클라이언트가 보낸 값에 덧붙이지 않고 덮어쓴다 (헤더를 바꿔 보내 로그인 실패 제한을 피하지 못하게).
    # 앞에 다른 프록시를 둘 때는 realip 모듈(set_real_ip_from, real_ip_header)로 그 프록시만 믿게 한다
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
    client_max_body_size 1m;

    location /api/ {
        proxy_pass http://backend:8080;
        access_log /var/log/nginx/access.log minimal;
    }

    # 비밀번호 재설정 메일도 같은 한도를 쓴다 (메일을 마구 보내게 하지 못하게)
    location = /api/auth/reset-request {
        limit_req zone=signup burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://backend:8080;
        access_log /var/log/nginx/access.log minimal;
    }

    location = /api/auth/signup {
        limit_req zone=signup burst=40 nodelay;
        limit_req_status 429;
        proxy_pass http://backend:8080;
        access_log /var/log/nginx/access.log minimal;
    }

    # 이름에 해시가 붙는 파일은 오래 캐시한다
    location /assets/ {
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # 화면 주소(/mentees/<멘티 이름>)에는 멘티 이름이 들어가므로 로그에 남기지 않는다.
    # index.html은 매번 새 것인지 확인하게 하고(새로 배포한 뒤 옛 화면이 남지 않게), 다른 사이트가 화면을 끼워 넣지 못하게 한다
    location / {
        access_log off;
        add_header Cache-Control "no-cache";
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri $uri/ /index.html;
    }
}
