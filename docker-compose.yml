services:
  ai-server:
    build: ./ai-server
    env_file: .env
    environment:
      # API 서버는 pgvector에서 검색한다. 평가(run_eval)는 이 값과 상관없이 file 방식이 기본이다.
      VECTOR_BACKEND: ${VECTOR_BACKEND:-pgvector}
      # 답 못 한 질문 모음. 기본은 꺼 둔다 (서버에 질문을 저장하지 않는다).
      # on이면 가린 질문 문장·분류·문의처·날짜만 저장한다. 운영 기관과 협의한 뒤에 켠다
      UNANSWERED_LOG: ${UNANSWERED_LOG:-off}
      DATABASE_URL: postgresql://seoullearn:${POSTGRES_PASSWORD:-seoullearn_dev}@db:5432/seoullearn
    depends_on:
      db:
        condition: service_healthy
    ports:
      # 이 PC에서만 직접 접근할 수 있다. 로그인 검사는 backend가 하므로 밖에 열면 안 된다
      - "127.0.0.1:8000:8000"
    volumes:
      # 코드와 데이터를 컨테이너에 연결 (수정 즉시 반영, 평가 결과도 로컬에 남음)
      - ./ai-server:/project/ai-server
      - ./data:/project/data:ro
      - ./eval:/project/eval
      - ./forms:/project/forms:ro
      # 프롬프트와 문구 템플릿 (문구만 따로 고칠 수 있다)
      - ./prompts:/project/prompts:ro
      - ./templates:/project/templates:ro
      # 가상 데이터. 테스트와 평가에서만 읽는다
      - ./synthetic:/project/synthetic:ro
      - ./scripts:/project/scripts:ro
      - ./.cache:/project/.cache
      # 임베딩 모델 다운로드 캐시 (한 번만 받음)
      - hf-cache:/hf-cache

  # 업무 백엔드: 로그인·역할, 양식 스키마, AI 서버 중계. 화면은 이 서비스(/api)로만 요청한다.
  backend:
    build: ./backend
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/seoullearn
      DATABASE_USERNAME: seoullearn
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-seoullearn_dev}
      AI_SERVER_URL: http://ai-server:8000
      FORMS_DIR: /forms
      # 둘 다 있으면 시작할 때 관리자 계정을 만든다 (.env에 넣는다)
      ADMIN_USERNAME: ${ADMIN_USERNAME:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      # 협약 장소 지도. 장소 목록 파일과 카카오맵 JavaScript 키 (브라우저에 노출되는 공개 키)
      PLACES_FILE: /data/places.json
      TEMPLATES_DIR: /templates
      KAKAO_MAP_JS_KEY: ${KAKAO_MAP_JS_KEY:-}
      # frontend(nginx)가 넘겨주는 접속 주소를 쓴다 (로그인 실패 제한이 사용자별로 걸리게)
      SERVER_FORWARD_HEADERS_STRATEGY: native
    ports:
      # 이 PC에서만 직접 접근할 수 있다 (점검 스크립트, curl용). 사용자는 frontend로 들어온다
      - "127.0.0.1:8080:8080"
    volumes:
      - ./forms:/forms:ro
      # 지금은 임시로 넣은 스터디카페 목록이다 (실제 협약 장소가 아니다). 실제 협약 장소 목록을 받으면 이 파일만 바꾼다
      - ./data/places/study_cafes_temp.json:/data/places.json:ro
      # 종합활동계획서 서식 파일(docx, hwpx). 저장소에 올리지 않는 자료라 이 폴더에 따로 둔다. 없으면 서식 파일로 내보내기를 쓰지 못한다
      - ./data/templates/2026:/templates:ro
    depends_on:
      db:
        condition: service_healthy
      ai-server:
        condition: service_started

  # 화면 (Vue). 정적 파일을 내주고 /api 요청을 backend로 넘긴다. http://localhost:3000
  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

  # 회원 테이블(app_user)과 벡터 색인(rag_chunks) 저장소. 멘티 관련 데이터는 넣지 않는다. 포트는 밖으로 열지 않는다.
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: seoullearn
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-seoullearn_dev}
      POSTGRES_DB: seoullearn
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U seoullearn -d seoullearn"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
  hf-cache:
