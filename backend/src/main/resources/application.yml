spring:
  application:
    name: mentor-backend
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/seoullearn}
    username: ${DATABASE_USERNAME:seoullearn}
    password: ${DATABASE_PASSWORD:seoullearn_dev}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # 테이블은 schema.sql로만 만든다
  sql:
    init:
      mode: always
  # 비밀번호 재설정 메일을 보내는 SMTP 서버. MAIL_HOST가 비어 있으면 메일을 보내지 않는다
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

server:
  port: 8080
  servlet:
    session:
      timeout: 2h
      cookie:
        http-only: true
        same-site: strict
        secure: ${SESSION_COOKIE_SECURE:false}   # HTTPS로 배포할 때 true
  error:
    include-message: never
    include-stacktrace: never

app:
  forms-dir: ${FORMS_DIR:../forms}
  places-file: ${PLACES_FILE:../synthetic/places.json}
  # 종합활동계획서 서식 파일(docx, hwpx)을 두는 폴더. 저장소에 넣지 않는 자료다
  templates-dir: ${TEMPLATES_DIR:../data/templates/2026}
  kakao-map-js-key: ${KAKAO_MAP_JS_KEY:}
  ai-server:
    url: ${AI_SERVER_URL:http://localhost:8000}
    connect-timeout: 3s
    read-timeout: 90s
  # 메일에 넣는 화면 주소와 보내는 사람. RESET_LOG_LINK는 개발용이다: 메일 서버 없이 확인하려고 재설정 주소를 로그에 찍는다 (운영에서는 켜지 않는다)
  base-url: ${APP_BASE_URL:http://localhost:3000}
  mail-from: ${MAIL_FROM:}
  reset-log-link: ${RESET_LOG_LINK:false}
  admin:
    username: ${ADMIN_USERNAME:}
    password: ${ADMIN_PASSWORD:}

logging:
  level:
    # 요청·응답 본문이나 SQL 값을 찍는 로그는 켜지 않는다
    org.springframework.web: INFO
    org.hibernate.SQL: WARN
